name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers_core
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            papers_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('papers_core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Reject machine-local dependency paths
        run: |
          if grep --line-number -E 'path[[:space:]]*=[[:space:]]*"/tmp/scirust' Cargo.toml; then
            echo 'machine-local /tmp/scirust Cargo dependency detected' >&2
            exit 1
          fi

      - name: Format changed Rust files
        working-directory: .
        shell: bash
        env:
          FORMAT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git cat-file -e "$FORMAT_BASE_SHA^{commit}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$FORMAT_BASE_SHA" HEAD -- 'papers_core/**/*.rs')
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          for file in "${files[@]}"; do
            echo "Checking $file"
            rustfmt --edition 2021 --check "$file"
          done

      - name: Test
        run: cargo test --all-targets --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Doc
        run: cargo doc --no-deps --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249

      - name: Install cargo-audit
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8
        with:
          tool: cargo-audit

      - name: Security audit
        working-directory: papers_core
        run: cargo audit
