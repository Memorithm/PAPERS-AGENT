name: CI

on:
  push:
    branches:
      - master
      - feat/scientific-contracts-ccos-rsi
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Reject machine-local dependency paths
        run: |
          if grep -R --line-number --fixed-strings '/tmp/scirust' Cargo.toml src tests; then
            echo 'machine-local /tmp/scirust dependency/reference detected' >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
