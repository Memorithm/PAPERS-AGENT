name: Hub gVisor qualification

on:
  pull_request:
    branches: [master]
    paths:
      - papers_core/Cargo.toml
      - papers_core/Cargo.lock
      - papers_core/src/hub_gvisor.rs
      - papers_core/src/evolution/**
      - papers_core/src/engine.rs
      - papers_core/tests/hub_gvisor_live.rs
      - papers_core/qualification/hub-gvisor/**
      - .github/workflows/hub-gvisor-qualification.yml
  push:
    branches: [master]
    paths:
      - papers_core/Cargo.toml
      - papers_core/Cargo.lock
      - papers_core/src/hub_gvisor.rs
      - papers_core/src/evolution/**
      - papers_core/src/engine.rs
      - papers_core/tests/hub_gvisor_live.rs
      - papers_core/qualification/hub-gvisor/**
      - .github/workflows/hub-gvisor-qualification.yml

permissions:
  contents: read

jobs:
  live-qualified-consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PAPERS revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact qualified Hub source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Memorithm/scirust-hub
          ref: a1ce544d5a6027a224627b738268214775a56881
          path: scirust-hub
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install pinned gVisor release
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/google/gvisor/releases/download/release-20261005.0/gvisor-x86_64.tar.bz2
          curl --fail --location --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gvisor.tar.bz2" "$release"
          printf '%s  %s\n' 'bd4eb2ca0ee74f0fbbb5f5273ba011e79c56a29fbb047393b88b981cd3230ede' "$RUNNER_TEMP/gvisor.tar.bz2" | sha256sum --check -
          tar --extract --bzip2 --file "$RUNNER_TEMP/gvisor.tar.bz2" --directory "$RUNNER_TEMP" runsc
          sudo install -m 0755 "$RUNNER_TEMP/runsc" /usr/local/bin/runsc
          sudo /usr/local/bin/runsc install
          sudo systemctl reload docker
          docker run --rm --runtime=runsc hello-world
      - name: Verify retained qualification artifacts
        shell: bash
        run: |
          set -euo pipefail
          qualification=papers_core/qualification/hub-gvisor/qualification.json
          receipt=papers_core/qualification/hub-gvisor/receipt.json
          test "$(jq -r .source_commit "$qualification")" = a1ce544d5a6027a224627b738268214775a56881
          test "$(jq -r .workflow_run_id "$qualification")" = 38522621768
          test "$(jq -r .receipt_sha256 "$qualification")" = "$(sha256sum "$receipt" | cut -d' ' -f1)"
          archive=papers_core/qualification/hub-gvisor/owner-controls.zip
          printf '%s  %s\n' '6027dc5df69377f3df82337f3a68d6beb4804d171751f80cedb362d2fcebd89b' "$archive" | sha256sum --check -
          cmp <(unzip -p "$archive" qualification.json) "$qualification"
          cmp <(unzip -p "$archive" receipt.json) "$receipt"
          unzip -p "$archive" gvisor-workspace-quota/summary.json \
            | jq -e '.source_commit == "a1ce544d5a6027a224627b738268214775a56881" and .workflow_run_id == 38522621768 and .filesystem_image_bytes == 67108864 and .persistent_remount_positive and .bounded_multi_file_enospc and .bounded_inode_enospc and .nested_host_mount_refused_before_create and .journal_outside_guest_volume'
          for pair in 'bytes:AGGREGATE_bytes_ENOSPC=13' 'inodes:AGGREGATE_inodes_ENOSPC=241'; do
            name=${pair%:*}
            marker=${pair#*:}
            unzip -p "$archive" "gvisor-workspace-quota/$name.receipt.request.json" \
              | jq -e '.workspace_quota.max_bytes == 67108864 and .workspace_quota.max_inodes == 256'
            unzip -p "$archive" "gvisor-workspace-quota/$name.receipt.json" \
              | jq -e --arg marker "$marker" '.exit_code == 0 and .timed_out == false and .stdout_truncated == false and .stderr_truncated == false and (.stdout | contains($marker))'
          done
          # Retained owner observations, not a substitute for the live consumer.
          for pair in 'pid-limited:64' 'pid-positive-control:128'; do
            name=${pair%:*}
            budget=${pair#*:}
            unzip -p "$archive" "gvisor-controls/$name.receipt.request.json" \
              | jq -e --argjson budget "$budget" '.pids_limit == 512 and .guest_pids_limit == $budget and .timeout_ms == 15000'
          done
          unzip -p "$archive" gvisor-controls/pid-limited.receipt.json \
            | jq -e '.task_id == "papers-01-38522621768-pid-limited" and .exit_code == 0 and .timed_out == false and .stdout_truncated == false and .stderr_truncated == false and (.stdout | contains("PID_COUNTS=8,55,11") and contains("PID_UID=Uid:\t1001"))'
          unzip -p "$archive" gvisor-controls/pid-positive-control.receipt.json \
            | jq -e '.task_id == "papers-01-38522621768-pid-positive-control" and .exit_code == 0 and .timed_out == false and .stdout_truncated == false and .stderr_truncated == false and (.stdout | contains("PID_COUNTS=8,96,0") and contains("PID_UID=Uid:\t1001"))'
          # Exact retained real owner recovery facts, not scientific authority.
          unzip -p "$archive" gvisor-recovery/crash.json \
            | jq -e '.before.task_id == "papers-01-38522621768-recovery-crash" and .before == .after and .before.state == "owned" and .daemon.running == true and .guest_entry_observed == true and .cleaned.state == "cleaned" and .cleaned.owned_handle == .before.owned_handle and .daemon.container_id == .before.owned_handle and .daemon.labels["org.memorithm.hub.attempt"] == .before.attempt_id and .daemon.labels["org.memorithm.hub.request"] == .before.request_sha256'
          unzip -p "$archive" gvisor-recovery/lost-response.json \
            | jq -e '.reserved.task_id == "papers-01-38522621768-recovery-lost-response" and .reserved.state == "reserved" and .reserved.owned_handle == null and .owned.state == "owned" and .reserved.attempt_id == .owned.attempt_id and .daemon.running == false and .never_started == true and .cleaned.state == "cleaned" and .cleaned.owned_handle == .owned.owned_handle and .daemon.container_id == .owned.owned_handle and .daemon.labels["org.memorithm.hub.attempt"] == .owned.attempt_id and .daemon.labels["org.memorithm.hub.request"] == .owned.request_sha256'
          imported_guard=$(cargo metadata --locked --no-deps --format-version 1 --manifest-path papers_core/Cargo.toml \
            | jq -er '.packages[] | select(.name == "papers_core") | .dependencies[] | select(.name == "hub-executor") | .source')
          test "$imported_guard" = 'git+https://github.com/Memorithm/scirust-hub.git?rev=a1ce544d5a6027a224627b738268214775a56881'
          cargo metadata --locked --format-version 1 --manifest-path papers_core/Cargo.toml \
            | jq -e --arg expected 'git+https://github.com/Memorithm/scirust-hub.git?rev=a1ce544d5a6027a224627b738268214775a56881#a1ce544d5a6027a224627b738268214775a56881' \
              '[.packages[] | select(.name == "hub-executor" or .name == "hub-core" or .name == "hub-protocol" or .name == "hub-store-sqlite")] | length == 4 and all(.[]; .source == $expected)'
      - name: Build exact Hub adapter
        working-directory: scirust-hub
        env:
          SCIRUST_HUB_SOURCE_COMMIT: a1ce544d5a6027a224627b738268214775a56881
        run: cargo build --locked -p hub-executor --bin scirust-hub-gvisor
      - name: Execute PAPERS live consumer through runsc
        working-directory: papers_core
        shell: bash
        env:
          PAPERS_HUB_GVISOR_EXECUTABLE: ${{ github.workspace }}/scirust-hub/target/debug/scirust-hub-gvisor
          PAPERS_HUB_GVISOR_WORKSPACE_ROOT: ${{ runner.temp }}/papers-hub-workspaces
          PAPERS_HUB_GVISOR_WORKSPACE_VOLUME: ${{ runner.temp }}/papers-hub-workspaces/quota-volume
          PAPERS_HUB_GVISOR_QUALIFICATION: ${{ github.workspace }}/papers_core/qualification/hub-gvisor/qualification.json
          PAPERS_HUB_GVISOR_QUALIFICATION_RECEIPT: ${{ github.workspace }}/papers_core/qualification/hub-gvisor/receipt.json
          PAPERS_HUB_GVISOR_IMAGE: rust@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
        run: |
          set -euo pipefail
          mkdir -p "$PAPERS_HUB_GVISOR_WORKSPACE_ROOT"
          mkdir "$PAPERS_HUB_GVISOR_WORKSPACE_VOLUME"
          image="$RUNNER_TEMP/papers-quota.img"
          test ! -e "$image"
          truncate --size=64M "$image"
          timeout 30s mkfs.ext4 -F -q -m 0 -N 256 "$image"
          timeout 30s sudo mount -o loop,nodev,nosuid "$image" "$PAPERS_HUB_GVISOR_WORKSPACE_VOLUME"
          trap 'timeout 30s sudo umount "$PAPERS_HUB_GVISOR_WORKSPACE_VOLUME"' EXIT
          timeout 30s sudo chown "$(id -u):$(id -g)" "$PAPERS_HUB_GVISOR_WORKSPACE_VOLUME"
          cargo test --locked --test hub_gvisor_live -- --ignored --exact executes_untrusted_rust_through_qualified_hub_gvisor --nocapture \
            | tee "$RUNNER_TEMP/papers-hub-gvisor-live.log"
      - name: Retain PAPERS live evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: papers-hub-gvisor-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/papers-hub-gvisor-live.log
          if-no-files-found: error
          retention-days: 30
