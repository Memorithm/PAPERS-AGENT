name: Diagnose tests

on:
  push:
    branches:
      - feat/scientific-contracts-ccos-rsi

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers_core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests with annotated failure tail
        shell: bash
        run: |
          set +e
          cargo test --all-targets -- --nocapture 2>&1 | tee /tmp/papers-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/papers-tests.log').read_text(errors='replace')
          tail = '\n'.join(text.splitlines()[-140:])
          tail = tail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=PAPERS cargo test failure::{tail}')
          PY
            exit "$status"
          fi
