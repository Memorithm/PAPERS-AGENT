name: Normalize feature branch

on:
  push:
    branches:
      - feat/scientific-contracts-ccos-rsi

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: papers_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/scientific-contracts-ccos-rsi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Normalize Rust and minimally refresh lockfile
        run: |
          cargo fmt --all
          cargo metadata --format-version 1 --no-deps >/dev/null

      - name: Commit normalized files
        working-directory: .
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers_core
          git commit -m 'chore: normalize Rust formatting and lockfile'
          git push origin HEAD:feat/scientific-contracts-ccos-rsi
