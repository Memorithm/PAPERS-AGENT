[package]
name = "papers_core"
version = "0.4.0"
edition = "2021"
description = "PAPERS V2 - scientific intelligence engine with versioned CCOS/RSI interchange"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
ndarray = { version = "0.17", features = ["serde"] }
ndarray-stats = "0.6"
statrs = "0.17"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
pdf-extract = "0.10"
anyhow = "1.0"
thiserror = "1.0"
figment = { version = "0.10", features = ["toml", "env"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
metrics = "0.21"
metrics-exporter-prometheus = "0.13"
wasmtime = { version = "25", features = ["cranelift"] }
ort = { version = "2.0.0-rc.12", features = ["cuda", "ndarray"] }
hnsw_rs = "0.3"
dashmap = "5.5"
parking_lot = "0.12"
once_cell = "1.19"
semver = "1.0"
tempfile = "3.8"
walkdir = "2"
sha2 = "0.10"

# SciRust is intentionally not a build-time dependency of PAPERS core.
# Scientific/NAS/symbolic workloads cross a versioned runtime boundary toward
# SciRust / CCOS Research Lab instead of assuming a machine-local /tmp checkout.

[lib]
name = "papers_core"
path = "src/lib.rs"

[[bin]]
name = "papers"
path = "src/main.rs"

[[bin]]
name = "papers-contract"
path = "src/bin/papers_contract.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev]
debug = true