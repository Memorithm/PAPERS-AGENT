[package]
name = "papers_core"
version = "0.1.0"
edition = "2021"
description = "PAPERS V2 evolution core in Rust - fast loop, database, cognition"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "papers_core"
path = "src/lib.rs"
