[package]
name = "papers_core"
version = "0.3.0"
edition = "2021"
description = "PAPERS V2 - Full Rust engine with scirust integration"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
ndarray = { version = "0.16", features = ["serde"] }
ndarray-stats = "0.6"
statrs = "0.17"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
regex = "1"
pdf-extract = "0.10"

# ── SciRust crates ──
scirust-core = { path = "/tmp/scirust/scirust-core" }
scirust-symbolic = { path = "/tmp/scirust/scirust-symbolic" }
scirust-symreg = { path = "/tmp/scirust/scirust-symreg" }
scirust-solvers = { path = "/tmp/scirust/scirust-solvers" }
scirust-neuro-symbolic = { path = "/tmp/scirust/scirust-neuro-symbolic" }
scirust-nas = { path = "/tmp/scirust/scirust-nas" }

[lib]
name = "papers_core"
path = "src/lib.rs"

[[bin]]
name = "papers"
path = "src/main.rs"
