[package]
name = "papers_core"
version = "0.2.0"
edition = "2021"
description = "PAPERS V2 - Full Rust evolution engine (100% Rust)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
ndarray = "0.16"
ndarray-stats = "0.6"
statrs = "0.17"
petgraph = "0.6"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[lib]
name = "papers_core"
path = "src/lib.rs"

[[bin]]
name = "papers"
path = "src/main.rs"
