[project]
name = "papers-v2"
version = "0.1.0"
description = "Predictive Academic Paper Extraction & Engineering Research System v2"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "arxiv>=2.0.0",
    "pymupdf>=1.23.0",
    "pdfplumber>=0.10.0",
    "networkx>=3.2",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "sympy>=1.12",
    "markdown>=3.6",
    "python-frontmatter>=1.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "chromadb>=1.5.0",
    "sentence-transformers>=2.2.0",
    "aiohttp-cache>=4.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[project.scripts]
papers = "papers_v2.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papers_v2"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
